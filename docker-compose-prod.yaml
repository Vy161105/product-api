services:
  mongodb:
    image: mongo:latest
    container_name: nammongodb-prod
    ports:
      - "27018:27017"
    volumes:
      - mongodb_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-api:
    image: nguyenngocyenvy/product-api:latest
    container_name: product-api-prod
    ports:
      - "3003:3001"
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_prod_data: