name: Product CD Docker Hub

on:
  push:
    branches:
      - main

jobs:
  cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest

      - name: Check Docker Image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
          docker image inspect ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest

  deploy:
    needs: cd
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Pull latest Docker image
        run: |
          docker compose -f docker-compose-prod.yaml pull

      - name: Deploy Product API
        run: |
          docker compose -f docker-compose-prod.yaml up -d

      - name: Check containers
        run: |
          docker compose -f docker-compose-prod.yaml ps

      - name: Check Product API health
        shell: bash
        run: |
          sleep 10
          curl --fail http://localhost:3003/